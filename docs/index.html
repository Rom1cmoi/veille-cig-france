<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veille météo spatiale France</title>
<style>
:root{--bg:#F7F5EF;--surface:#fff;--ink:#1D2630;--muted:#667080;--line:#E3E0D6;--accent:#2563EB;--accent-soft:#E6EEFD}
@media (prefers-color-scheme:dark){:root{--bg:#14181D;--surface:#1B2027;--ink:#E6E9ED;--muted:#9AA4B0;--line:#2A313A;--accent:#7FA9F5;--accent-soft:#232D3D}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
h1{font-size:1rem;font-weight:600;margin:0 8px 0 0}
nav{display:flex;gap:6px}
nav button{font:inherit;font-weight:500;padding:7px 16px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);cursor:pointer}
nav button:hover{color:var(--ink)}
nav button[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.open{margin-left:auto;color:var(--muted);font-size:.85rem}
.open a{color:var(--accent);text-decoration:none}
main{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
iframe[hidden]{display:none}
</style>
</head>
<body>
<header>
  <h1>Veille météo spatiale France</h1>
  <nav role="tablist" aria-label="Parties du site">
    <button role="tab" id="t-telecom" data-v="telecom" aria-selected="true">Télécoms</button>
    <button role="tab" id="t-cig" data-v="cig" aria-selected="false">CIG France</button>
  </nav>
  <span class="open">Ouvrir seule : <a href="telecom.html">Télécoms</a> · <a href="cig.html">CIG France</a></span>
</header>
<main>
  <iframe id="f-telecom" title="Veille SWx Télécoms" data-src="telecom.html" hidden></iframe>
  <iframe id="f-cig" title="Veille CIG France" data-src="cig.html" hidden></iframe>
</main>
<script>
(function(){
  var views = ["telecom","cig"];
  function show(v){
    if (views.indexOf(v) < 0) v = "telecom";
    views.forEach(function(k){
      var f = document.getElementById("f-" + k), b = document.getElementById("t-" + k);
      var on = k === v;
      if (on && !f.src) f.src = f.getAttribute("data-src");
      f.hidden = !on;
      b.setAttribute("aria-selected", on ? "true" : "false");
    });
    try { history.replaceState(null, "", "#" + v); } catch (e) {}
  }
  document.querySelectorAll("nav button").forEach(function(b){
    b.addEventListener("click", function(){ show(b.getAttribute("data-v")); });
  });
  window.addEventListener("hashchange", function(){ show(location.hash.slice(1)); });
  show(location.hash.slice(1));
})();
</script>
</body>
</html>
