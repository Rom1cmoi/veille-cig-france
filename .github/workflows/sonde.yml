# Sonde ponctuelle (sondes/) : se lance quand un script de sonde change, ou à la main.
name: sonde

on:
  push:
    paths:
      - "sondes/*.py"
      - ".github/workflows/sonde.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python sondes/observatoires.py
      - name: Enregistrement
        run: |
          git config user.name "veille-cig-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sondes
          git commit -m "Sonde observatoires" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep 5; done
