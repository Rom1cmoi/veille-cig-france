# Lance le collecteur toutes les 5 minutes et publie le résultat dans docs/ (servi par GitHub Pages).
name: collecte

on:
  schedule:
    - cron: "*/30 * * * *"     # secours : la cadence de 5 min vient de cron-job.org (voir README),
                                # car GitHub retarde beaucoup ses propres lancements planifiés
  workflow_dispatch:            # bouton « Run workflow » pour lancer à la main
    inputs:
      test:
        description: "Envoyer une alerte de test"
        type: boolean
        default: false

permissions:
  contents: write               # autorise le robot à enregistrer les fichiers mis à jour
  issues: write                 # autorise le robot à ouvrir les « issues » d'alerte

concurrency:
  group: collecte               # jamais deux collectes en même temps
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                 # la dernière version, pas celle du déclenchement (sinon conflit si
                                    # deux lancements se suivent de près)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecte, calcul et alertes
        run: python collecteur.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}     # jeton fourni automatiquement par GitHub
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}         # facultatif : notifications push ntfy
          ALERTE_TEST: ${{ inputs.test }}
      - name: Enregistrement
        run: |
          git config user.name "veille-cig-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ journal/              # état, historique, alertes, CAP, cache DONKI, journal
          git commit -m "Donnees $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          # Si une autre collecte a enregistré entre-temps : on se recale sur elle et on réessaie (3 fois).
          # En cas de conflit sur un fichier, on garde la version de cette collecte (la plus récente).
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
