# Téléchargement ponctuel des données de réajustement du modèle L1 (sondes/reajustement.py).
name: reajustement-donnees

on:
  push:
    paths:
      - "sondes/reajustement.py"
      - ".github/workflows/reajustement.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python sondes/reajustement.py
      - name: Enregistrement
        run: |
          git config user.name "veille-cig-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reajustement
          git commit -m "Donnees de reajustement du modele L1" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep 5; done
